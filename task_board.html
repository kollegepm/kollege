<script>
(function(){
  // Кожна дошка має власний простір даних. Він задається в посиланні: ?board=math
  // Завдяки цьому одна Google-таблиця обслуговує дошки всіх предметів окремо.
  let BOARD_ID="admin-board";
  try{
    const b=new URLSearchParams(location.search).get("board");
    if(b && /^[a-zA-Z0-9_-]{1,32}$/.test(b)) BOARD_ID=b.trim();
  }catch(e){}
  let BOARD_TITLE="";
  try{
    const t=new URLSearchParams(location.search).get("title");
    if(t) BOARD_TITLE=decodeURIComponent(t).slice(0,40).replace(/[<>]/g,"");
  }catch(e){}
  const TASKS_KEY=BOARD_ID+":tasks", PEOPLE_KEY=BOARD_ID+":people", SPRINTS_KEY=BOARD_ID+":sprints",
        LOG_KEY=BOARD_ID+":log", IDENTITY_KEY=BOARD_ID+":identity", CREDS_KEY=BOARD_ID+":creds";
  const DEFAULT_PEOPLE = ["Тетяна Гаренко", "Ольга Петренко", "Марія Коваленко"];

  const COLUMNS = [
    { key:"backlog", name:"Беклог", color:"#b7a9dc" },
    { key:"todo", name:"Зробити", color:"#ef7726" },
    { key:"inprogress", name:"У роботі", color:"#8bb047" },
    { key:"done", name:"Зроблено", color:"#5c7a2e" },
    { key:"postponed", name:"Відкладено", color:"#B0A99C" },
  ];
  const PRIORITIES = { high:"Високий", medium:"Середній", low:"Низький" };
  const PRIO_STYLE = { high:{c:"#F6DCD5",tc:"#7A2E1E"}, medium:{c:"#F5DFC8",tc:"#8A4A1E"}, low:{c:"#DCE8DC",tc:"#2F4A2F"} };

  const isoOf = (d) => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };

  function defaultSprints() {
    const today=new Date(); const monday=new Date(today); monday.setDate(today.getDate()-((today.getDay()+6)%7));
    const mk=(w,n)=>{ const s=new Date(monday); s.setDate(monday.getDate()+w*7); const e=new Date(s); e.setDate(s.getDate()+6); return {id:"sp"+n,name:"Спринт "+n,start:isoOf(s),end:isoOf(e)}; };
    return [mk(-1,1),mk(0,2),mk(1,3)];
  }
  function seedTasks() {
    const today=new Date(); const plus=(n)=>{const d=new Date(today);d.setDate(d.getDate()+n);return isoOf(d);};
    const b=(o)=>Object.assign({checklist:[],completedAt:null,updatedAt:null,updatedBy:null},o);
    return [
      b({id:"t1",title:"Робочі програми та силабуси",link:"",status:"backlog",createdBy:"Тетяна Гаренко",assignee:"Ольга Петренко",priority:"medium",due:null,sprint:"sp2"}),
      b({id:"t2",title:"ОПП оновити",link:"",status:"backlog",createdBy:"Тетяна Гаренко",assignee:"Ольга Петренко",priority:"medium",due:null,sprint:"sp2"}),
      b({id:"t3",title:"Навчальний план ОПП",link:"",status:"backlog",createdBy:"Тетяна Гаренко",assignee:"Ольга Петренко",priority:"low",due:null,sprint:"sp3"}),
      b({id:"t4",title:"Почати вносити дані в Хмару",link:"https://collegemp.icloud.in.ua",status:"todo",createdBy:"Тетяна Гаренко",assignee:"Ольга Петренко",priority:"medium",due:null,sprint:"sp2",checklist:[{id:"c1",text:"Створити структуру папок",done:true},{id:"c2",text:"Внести перший розділ",done:false}]}),
      b({id:"t5",title:"Підготувати звіт для акредитації",link:"",status:"todo",createdBy:"Тетяна Гаренко",assignee:"Марія Коваленко",priority:"high",due:plus(3),sprint:"sp2",checklist:[{id:"c3",text:"Зібрати показники",done:true},{id:"c4",text:"Оформити таблиці",done:false},{id:"c5",text:"Вичитати",done:false}]}),
      b({id:"t6",title:"Встановити Едюкейшн",link:"",status:"inprogress",createdBy:"Тетяна Гаренко",assignee:"Ольга Петренко",priority:"high",due:isoOf(today),sprint:"sp2"}),
      b({id:"t7",title:"Розібратися та зареєструватись у системі оновлень",link:"https://osvita.net/ua/pro-updates/vyyshla-nova-versiia-prohramy-2-3-0-11/",status:"done",createdBy:"Тетяна Гаренко",assignee:"Ольга Петренко",priority:"low",due:null,sprint:"sp1",completedAt:plus(-4)}),
      b({id:"t8",title:"Додати печатку закладу на всі документи",link:"",status:"done",createdBy:"Тетяна Гаренко",assignee:"Ольга Петренко",priority:"medium",due:plus(-1),sprint:"sp1",completedAt:plus(-2)}),
      b({id:"t9",title:"Оновити анкету для викладачів",link:"",status:"postponed",createdBy:"Тетяна Гаренко",assignee:"Марія Коваленко",priority:"low",due:plus(10),sprint:"sp3"}),
    ];
  }

  const state = {
    view:"kanban", tasks:[], people:[], sprints:[], log:[], identity:null, creds:[],
    selectedSprint:"all",
    filters:{search:"",status:"all",createdBy:"all",assignee:"all",priority:"all",due:"all"},
    calMonth:new Date().getMonth(), calYear:new Date().getFullYear(),
    modal:null, dragId:null, dragMoved:false, showMore:false, revealPass:null, loaded:false,
  };

  function isAdmin() { return !!state.identity && state.creds.some(c=>c.name===state.identity); }
  function isMaster() { return isAdmin() && (state.creds.find(c=>c.name===state.identity)||{}).master === true; }
  // lightweight non-cryptographic obfuscation for stored codes (deters casual viewing, not real security)
  // One-way hash: the plaintext password is NEVER stored, only this fingerprint.
  // A per-board random salt makes the hashes specific to this file.
  function hashCode(pass, salt){
    const str = (salt||"") + "::" + pass;
    let h1 = 0x811c9dc5, h2 = 0xc2b2ae35 >>> 0;
    for(let i=0;i<str.length;i++){
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 0x01000193) >>> 0;
      h2 = Math.imul((h2 ^ ((ch<<3)|(ch>>>2)))>>>0, 0x85ebca6b) >>> 0;
    }
    return (h1>>>0).toString(16).padStart(8,"0") + (h2>>>0).toString(16).padStart(8,"0");
  }
  function verifyCode(pass, cred){ if(!pass||!cred) return false; return hashCode(pass, cred.salt) === cred.hash; }
  function newCred(name, pass, master){ const salt = Math.random().toString(36).slice(2,10); return { name, salt, hash: hashCode(pass, salt), master: !!master }; }
  function genCode(){ const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }

  // ---- Спільне сховище в Google-таблиці -------------------------------------
  // Адреса береться з посилання (?sheet=...) або з пам'яті браузера.
  const SHEET_URL_KEY="admin-board:sheet-url";
  let SHEET_URL="";
  try{
    const p=new URLSearchParams(location.search).get("sheet");
    if(p){ SHEET_URL=p.trim(); try{ localStorage.setItem(SHEET_URL_KEY,SHEET_URL); }catch(e){} }
    else { try{ SHEET_URL=localStorage.getItem(SHEET_URL_KEY)||""; }catch(e){} }
  }catch(e){}
  let remoteCache={}, remoteOk=false, remoteError="";
  function remoteOn(){ return !!SHEET_URL; }

  async function remoteLoadAll(){
    if(!remoteOn()) return false;
    try{
      const r=await fetch(SHEET_URL,{method:"GET"});
      const j=await r.json();
      if(j&&j.ok){ remoteCache=j.data||{}; remoteOk=true; remoteError=""; return true; }
      remoteError=(j&&j.error)?j.error:"Таблиця не відповіла";
    }catch(e){ remoteError="Немає зв'язку з таблицею"; }
    remoteOk=false; return false;
  }
  async function remoteSave(key,val){
    if(!remoteOn()) return;
    const payload=JSON.stringify(val);
    remoteCache[key]=payload;
    try{
      await fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({items:{[key]:payload}})});
      remoteOk=true; remoteError="";
    }catch(e){ remoteOk=false; remoteError="Зміну не вдалося зберегти в таблицю"; }
  }

  // Storage layer: use Claude's window.storage inside the preview; fall back to
  // the browser's localStorage when the file is downloaded or hosted elsewhere.
  const store = (typeof window !== "undefined" && window.storage) ? window.storage : {
    get(key){ try{ const v=localStorage.getItem(key); return Promise.resolve(v!=null?{key,value:v}:null); }catch(e){ return Promise.resolve(null); } },
    set(key,value){ try{ localStorage.setItem(key,value); }catch(e){} return Promise.resolve({key,value}); },
    delete(key){ try{ localStorage.removeItem(key); }catch(e){} return Promise.resolve({key,deleted:true}); },
    list(){ return Promise.resolve({keys:[]}); },
  };

  async function getShared(key, fallback, persistFn){
    if(remoteOn()&&remoteOk&&Object.prototype.hasOwnProperty.call(remoteCache,key)){
      try{ return JSON.parse(remoteCache[key]); }catch(e){}
    }
    if(remoteOn()&&remoteOk){ try{ if(persistFn) persistFn(fallback); }catch(e){} return fallback; }
    try{ const r=await store.get(key,true); if(r&&r.value) return JSON.parse(r.value);}catch(e){}
    try{ if(persistFn) persistFn(fallback); }catch(e){}
    return fallback;
  }
  function setShared(key,val){
    try{ Promise.resolve(store.set(key,JSON.stringify(val),true)).catch(()=>{}); }catch(e){}
    if(remoteOn()) return remoteSave(key,val);
  }

  async function loadState(){
    try {
      if(remoteOn()) { await remoteLoadAll(); }
      state.tasks   = await getShared(TASKS_KEY, seedTasks(), v=>setShared(TASKS_KEY,v));
      state.people  = await getShared(PEOPLE_KEY, DEFAULT_PEOPLE.slice(), v=>setShared(PEOPLE_KEY,v));
      state.sprints = await getShared(SPRINTS_KEY, defaultSprints(), v=>setShared(SPRINTS_KEY,v));
      state.log     = await getShared(LOG_KEY, [], v=>setShared(LOG_KEY,v));
      const loadedCreds = await getShared(CREDS_KEY, [], v=>setShared(CREDS_KEY,v));
      state.creds = Array.isArray(loadedCreds) ? loadedCreds : [];
      try{ const r=await store.get(IDENTITY_KEY,false); if(r&&r.value) state.identity=JSON.parse(r.value);}catch(e){}
      // a stored identity only counts if it still matches an existing credential; otherwise treat as viewer
      if(state.identity && !state.creds.some(c=>c.name===state.identity)) { state.identity=null; }
    } catch(e) {
      console.error("Помилка завантаження, показуємо початкові дані:", e);
      if(!state.tasks.length) state.tasks = seedTasks();
      if(!state.people.length) state.people = DEFAULT_PEOPLE.slice();
      if(!state.sprints.length) state.sprints = defaultSprints();
    } finally {
      state.loaded = true;
      try { render(); } catch(e) {
        console.error(e);
        document.getElementById("admin-board-root").innerHTML =
          '<div style="padding:40px;font-family:sans-serif;color:#C1503D;">Сталася помилка відображення. Спробуйте оновити сторінку.</div>';
      }
      startAutoRefresh();
    }
  }

  // Періодично забираємо свіжі дані з таблиці, щоб бачити зміни колег.
  let refreshTimer=null;
  function startAutoRefresh(){
    if(!remoteOn() || refreshTimer) return;
    refreshTimer=setInterval(async()=>{
      if(state.modal) return;                 // не перериваємо роботу у вікні
      const before=JSON.stringify(remoteCache);
      const ok=await remoteLoadAll();
      if(!ok || JSON.stringify(remoteCache)===before) return;
      try{
        state.tasks   = remoteCache[TASKS_KEY]   ? JSON.parse(remoteCache[TASKS_KEY])   : state.tasks;
        state.people  = remoteCache[PEOPLE_KEY]  ? JSON.parse(remoteCache[PEOPLE_KEY])  : state.people;
        state.sprints = remoteCache[SPRINTS_KEY] ? JSON.parse(remoteCache[SPRINTS_KEY]) : state.sprints;
        state.log     = remoteCache[LOG_KEY]     ? JSON.parse(remoteCache[LOG_KEY])     : state.log;
        state.creds   = remoteCache[CREDS_KEY]   ? JSON.parse(remoteCache[CREDS_KEY])   : state.creds;
        render();
      }catch(e){}
    }, 15000);
  }

  let tSave=null;
  function persistTasks(){ clearTimeout(tSave); tSave=setTimeout(()=>setShared(TASKS_KEY,state.tasks),250); }
  function persistPeople(){ setShared(PEOPLE_KEY,state.people); }
  function persistSprints(){ setShared(SPRINTS_KEY,state.sprints); }
  function persistLog(){ setShared(LOG_KEY,state.log); }
  function persistCreds(){ setShared(CREDS_KEY,state.creds); }
  function persistIdentity(){ try{ Promise.resolve(store.set(IDENTITY_KEY,JSON.stringify(state.identity),false)).catch(()=>{}); }catch(e){} }

  function logAction(action,taskTitle){ state.log.unshift({id:"l"+Math.random().toString(36).slice(2,9),who:state.identity||"невідомо",action,taskTitle:taskTitle||"",ts:new Date().toISOString()}); state.log=state.log.slice(0,100); persistLog(); }

  function uid(){ return "t"+Math.random().toString(36).slice(2,10); }
  function initials(n){ if(!n) return "?"; return n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
  function sprintById(id){ return state.sprints.find(s=>s.id===id)||null; }
  function sortedSprints(){ return state.sprints.slice().sort((a,b)=>b.start.localeCompare(a.start)); }
  function sprintIsPast(s){ const today=isoOf(new Date()); return s.end < today; }
  function sprintOptionsHTML(selectedId, isFilter){
    // group: active + upcoming first (newest start on top), then finished
    const all = sortedSprints();
    const active = all.filter(s=>!sprintIsPast(s));
    const past = all.filter(s=>sprintIsPast(s));
    const opt = (s) => `<option value="${s.id}" ${selectedId===s.id?'selected':''}>${s.name} · ${fmtRange(s)}</option>`;
    let html = "";
    if(active.length) html += `<optgroup label="Активні та майбутні">${active.map(opt).join("")}</optgroup>`;
    if(past.length) html += `<optgroup label="Завершені">${past.map(opt).join("")}</optgroup>`;
    return html;
  }
  function fmtDate(d){ if(!d) return ""; return new Date(d+"T00:00:00").toLocaleDateString("uk-UA",{day:"numeric",month:"short"}); }
  function fmtRange(s){ return s?`${fmtDate(s.start)} – ${fmtDate(s.end)}`:""; }
  function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString("uk-UA",{day:"numeric",month:"short"})+", "+d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}); }
  function dueBadgeClass(due){ if(!due) return ""; const t=new Date(); t.setHours(0,0,0,0); const d=new Date(due+"T00:00:00"); if(d<t) return "due-overdue"; if(d.getTime()===t.getTime()) return "due-today"; return ""; }
  function withinSprint(due,sid){ const s=sprintById(sid); if(!s||!due) return true; return due>=s.start&&due<=s.end; }
  function checklistProgress(t){ if(!t.checklist||!t.checklist.length) return null; return {done:t.checklist.filter(i=>i.done).length,total:t.checklist.length}; }
  function daysLeftText(due){ const t=new Date();t.setHours(0,0,0,0); const d=new Date(due+"T00:00:00"); const diff=Math.round((d-t)/86400000); if(diff<0) return `протерміновано на ${Math.abs(diff)} дн.`; if(diff===0) return "сьогодні"; if(diff===1) return "завтра"; return `${diff} дн.`; }

  function scopeTasks(){ return state.selectedSprint==="all" ? state.tasks : state.tasks.filter(t=>t.sprint===state.selectedSprint); }
  function applyFilters(tasks){
    const f=state.filters;
    return tasks.filter(t=>{
      if(state.selectedSprint!=="all" && t.sprint!==state.selectedSprint) return false;
      if(f.search){ const q=f.search.toLowerCase(); const hay=[t.title,t.assignee,t.link].filter(Boolean).join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
      if(f.status!=="all" && t.status!==f.status) return false;
      if(f.createdBy!=="all" && t.createdBy!==f.createdBy) return false;
      if(f.assignee!=="all" && t.assignee!==f.assignee) return false;
      if(f.priority!=="all" && t.priority!==f.priority) return false;
      if(f.due!=="all"){ const t0=new Date();t0.setHours(0,0,0,0);
        if(f.due==="overdue"){ if(!t.due||new Date(t.due+"T00:00:00")>=t0) return false; }
        else if(f.due==="today"){ if(!t.due||new Date(t.due+"T00:00:00").getTime()!==t0.getTime()) return false; }
        else if(f.due==="nodate"){ if(t.due) return false; } }
      return true;
    });
  }
  function stampTask(t){ t.updatedAt=new Date().toISOString(); t.updatedBy=state.identity; }

  function toast(msg){
    const root=document.getElementById("admin-board-root");
    let el=root.querySelector(".toast");
    if(!el){ el=document.createElement("div"); el.className="toast"; root.appendChild(el); }
    el.textContent=msg; requestAnimationFrame(()=>el.classList.add("show"));
    clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2200);
  }

  // ---------- render ----------
  function render(){
    const root=document.getElementById("admin-board-root");
    if(!state.loaded){ root.innerHTML=`<div style="padding:50px;text-align:center;color:#6B7280;">Завантаження…</div>`; return; }
    root.innerHTML = `
      <svg class="brand-blob b1" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M60 10C120-8 210 6 232 60c20 50-24 96-78 104C96 172 40 150 20 104-2 54 12 24 60 10Z" fill="#8bb047" opacity="0.35"/></svg>
      <svg class="brand-blob b2" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M40 40C0 88 4 150 54 176c46 24 108 12 138-30 26-38 20-92-24-118C118 2 76-4 40 40Z" fill="#b7a9dc" opacity="0.35"/><path d="M150 120c34 6 62 40 54 78-40 8-88-8-102-46-8-24 14-38 48-32Z" fill="#ef7726" opacity="0.28"/></svg>
      ${topbarHTML()}
      ${filterbarHTML()}
      ${summaryHTML()}
      ${state.view==="kanban"?kanbanHTML():calendarHTML()}
      <div class="storage-note">${isAdmin()?"Ви адміністратор: можете створювати й редагувати задачі.":"Режим перегляду. Редагувати може лише адміністратор дошки."} Кожна зміна фіксується в журналі. ${remoteOn()?(remoteOk?"<b style=\"color:#5c7a2e\">Спільна таблиця підключена</b> — усі бачать однакові картки.":"<b style=\"color:#C1503D\">Немає зв'язку з таблицею</b> — "+remoteError+". Зміни збережено лише на цьому пристрої."):"<b>Локальний режим</b> — картки зберігаються лише в цьому браузері. Щоб дошка стала спільною, підключіть Google-таблицю в налаштуваннях."}</div>
    `;
    bindEvents();
    if(state.modal){
      const m=state.modal.mode;
      if(m==="identity") renderIdentityModal();
      else if(m==="settings") renderSettingsModal();
      else if(m==="log") renderLogModal();
      else if(m==="view") renderViewModal();
      else if(m==="edit"||m==="create") renderModal();
    }
  }

  function topbarHTML(){
    const sel=state.selectedSprint;
    const admin=isAdmin();
    const chip = state.identity
      ? `<div class="whoami" data-whoami title="Профіль / вийти"><span class="avatar">${initials(state.identity)}</span>${state.identity}<span class="role-tag admin">${isMaster()?'головний':'адмін'}</span></div>`
      : `<div class="whoami guest" data-whoami title="Увійти за паролем"><span class="avatar">?</span>Увійти</div>`;
    return `
      <div class="topbar">
        <div class="logo-plate"><img src="data:image/png;base64,${LOGO_B64}" alt="Логотип коледжу"></div>
        <div class="topbar-title" style="margin-right:auto;">ДОШКА ЗАДАЧ${BOARD_TITLE?` <span style="font-weight:400;color:var(--orange);">· ${BOARD_TITLE}</span>`:""}</div>
        <div class="view-switch">
          <button class="view-btn ${state.view==='kanban'?'active':''}" data-view="kanban">Канбан</button>
          <button class="view-btn ${state.view==='calendar'?'active':''}" data-view="calendar">Календар</button>
        </div>
        <div class="sprint-picker">
          <select data-sprint>
            <option value="all" ${sel==='all'?'selected':''}>Усі спринти</option>
            ${sprintOptionsHTML(sel, true)}
          </select>
        </div>
        <button class="icon-btn" data-log>Історія</button>
        ${admin?`<button class="icon-btn" data-settings title="Налаштування">⚙ Налаштування</button>`:""}
        ${chip}
      </div>`;
  }

  function filterbarHTML(){
    const f=state.filters; const opt=(v,l,c)=>`<option value="${v}" ${v===c?'selected':''}>${l}</option>`;
    const filtered=applyFilters(state.tasks);
    return `
      <div class="filterbar">
        <input type="text" placeholder="Пошук: назва, відповідальний, посилання..." value="${f.search}" data-filter="search">
        <select data-filter="status">${opt("all","Статус: усі",f.status)}${COLUMNS.map(c=>opt(c.key,c.name,f.status)).join("")}</select>
        <select data-filter="assignee">${opt("all","Відповідальний: усі",f.assignee)}${state.people.map(v=>opt(v,v,f.assignee)).join("")}</select>
        <select data-filter="priority">${opt("all","Пріоритет: усі",f.priority)}${Object.entries(PRIORITIES).map(([k,v])=>opt(k,v,f.priority)).join("")}</select>
        <select data-filter="due">${opt("all","Термін: усі",f.due)}${opt("overdue","Протерміновано",f.due)}${opt("today","Сьогодні",f.due)}${opt("nodate","Без терміну",f.due)}</select>
        <span class="filter-count">${filtered.length} з ${state.tasks.length}</span>
        <button class="filter-reset" data-reset>Скинути</button>
      </div>`;
  }

  function summaryHTML(){
    const scope=scopeTasks();
    const total=scope.length;
    const today=new Date(); today.setHours(0,0,0,0);
    const overdue=scope.filter(t=>t.due && t.status!=="done" && new Date(t.due+"T00:00:00")<today).length;
    const weekAgo=new Date(Date.now()-7*86400000);
    const doneWeek=scope.filter(t=>t.completedAt && new Date(t.completedAt+"T00:00:00")>=weekAgo).length;
    const inWork=scope.filter(t=>t.status==="inprogress").length;
    const sp=state.selectedSprint!=="all"?sprintById(state.selectedSprint):null;
    return `
      <div class="summary">
        <div class="s"><b>${total}</b> задач${sp?` у спринті «${sp.name}»`:" усього"}</div>
        <div class="s"><b>${inWork}</b> у роботі</div>
        <div class="s warn"><b>${overdue}</b> протерміновано</div>
        <div class="s good"><b>${doneWeek}</b> завершено за тиждень</div>
        ${sp?`<div class="sprint-note">${fmtRange(sp)}</div>`:""}
      </div>`;
  }

  function cardHTML(t){
    const dueClass=dueBadgeClass(t.due); const cl=checklistProgress(t); const prio=PRIORITIES[t.priority]||"";
    return `
      <div class="card ${isAdmin()?'draggable':''}" ${isAdmin()?'draggable="true"':''} data-id="${t.id}" style="border-left-color:${COLUMNS.find(c=>c.key===t.status).color}">
        <div class="card-title">${t.title}</div>
        ${t.link?`<a class="card-link" href="${t.link}" target="_blank" rel="noopener">${t.link}</a>`:""}
        <div class="card-footer">
          <span class="prio-flag ${t.priority}" title="Пріоритет: ${prio}">&#9873; ${prio}</span>
          ${t.status==='done'&&t.completedAt?`<span class="badge done-at" title="Завершено">&#10003; ${fmtDate(t.completedAt)}</span>`:(t.due?`<span class="badge ${dueClass}">${fmtDate(t.due)}</span>`:"")}
          ${cl?`<span class="badge">&#9745; ${cl.done}/${cl.total}</span>`:""}
          ${t.assignee?`<span class="avatars"><span class="avatar" title="${t.assignee}">${initials(t.assignee)}</span></span>`:""}
        </div>
      </div>`;
  }

  function kanbanHTML(){
    const filtered=applyFilters(state.tasks); const admin=isAdmin();
    return `
      <div class="kanban-wrap"><div class="kanban">
        ${COLUMNS.map(col=>{
          const ct=filtered.filter(t=>t.status===col.key);
          return `<div class="kcol" data-col="${col.key}">
            <div class="kcol-head"><span class="kcol-dot" style="background:${col.color}"></span><span>${col.name}</span><span class="kcol-count">${ct.length}</span></div>
            ${ct.map(cardHTML).join("")}
            ${admin?`<button class="kcol-add" data-add-to="${col.key}">+ Додати картку</button>`:""}
          </div>`;
        }).join("")}
      </div></div>`;
  }

  function calendarHTML(){
    const y=state.calYear,m=state.calMonth; const first=new Date(y,m,1);
    const startDow=(first.getDay()+6)%7; const dim=new Date(y,m+1,0).getDate(); const dip=new Date(y,m,0).getDate();
    const today=new Date(); today.setHours(0,0,0,0);
    const monthName=first.toLocaleDateString("uk-UA",{month:"long",year:"numeric"});
    const sp=state.selectedSprint!=="all"?sprintById(state.selectedSprint):null;
    const filtered=applyFilters(state.tasks);
    const byDate={}; filtered.forEach(t=>{ if(t.due)(byDate[t.due]=byDate[t.due]||[]).push(t); });
    const noDated=filtered.filter(t=>!t.due).length;
    let cells=[];
    for(let i=startDow-1;i>=0;i--) cells.push({day:dip-i,other:true});
    for(let d=1;d<=dim;d++){ const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; cells.push({day:d,other:false,dateStr:ds,inSprint:sp&&ds>=sp.start&&ds<=sp.end,isToday:new Date(ds+"T00:00:00").getTime()===today.getTime()}); }
    while(cells.length%7!==0) cells.push({day:cells.length,other:true});
    const dows=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
    return `
      <div class="cal-wrap">
        <div class="cal-header">
          <button class="cal-nav" data-cal-prev>&#8249;</button><h3>${monthName}</h3><button class="cal-nav" data-cal-next>&#8250;</button>
          ${sp?`<div class="cal-legend"><span class="swatch"></span>дні спринта «${sp.name}»</div>`:""}
        </div>
        ${noDated>0?`<div class="cal-hint">У календарі показані задачі з кінцевим терміном. Ще ${noDated} задач(і) без дати — вони видимі на канбані.</div>`:""}
        <div class="cal-grid">
          ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join("")}
          ${cells.map(c=>`<div class="cal-cell ${c.other?'other-month':''} ${c.isToday?'today':''} ${c.inSprint?'in-sprint':''}"><div class="cal-daynum">${c.day}</div>${c.dateStr&&byDate[c.dateStr]?byDate[c.dateStr].map(t=>`<div class="cal-task ${t.priority}" data-id="${t.id}">${t.title}</div>`).join(""):""}</div>`).join("")}
        </div>
      </div>`;
  }

  // ---------- modal infra ----------
  function ensureOverlay(){ let o=document.getElementById("admin-board-modal-overlay"); if(!o){ o=document.createElement("div"); o.id="admin-board-modal-overlay"; o.className="modal-overlay"; document.getElementById("admin-board-root").appendChild(o);} return o; }
  function closeModal(){ state.modal=null; state.showMore=false; state.revealPass=null; const o=document.getElementById("admin-board-modal-overlay"); if(o) o.remove(); }

  function renderIdentityModal(){
    const o=ensureOverlay();
    // First run ever: no admin credentials exist -> set up the master admin
    if(!state.creds.length){
      o.innerHTML=`
        <div class="modal">
          <h3>Створення головного адміністратора</h3>
          <p style="font-size:12.5px;color:var(--grey);margin:0 0 14px 0;">Це перше налаштування дошки. Створіть головного адміністратора — ваше ім'я та пароль. Далі ви зможете видавати паролі іншим адміністраторам.</p>
          <div class="field-label">Ваше ім'я</div>
          <input type="text" id="f-master-name" placeholder="Напр.: Тетяна Гаренко" value="${state.people[0]||''}">
          <div class="field-label">Пароль</div>
          <input type="text" id="f-master-pass" placeholder="Придумайте пароль">
          <div id="setup-warn"></div>
          <div class="modal-actions"><div></div><button class="btn primary" data-setup>Створити</button></div>
        </div>`;
      o.querySelector("[data-setup]").addEventListener("click",()=>{

  function renamePerson(oldName,newName){
    newName=(newName||"").trim(); if(!newName||newName===oldName) return false;
    if(state.people.some(p=>p.toLowerCase()===newName.toLowerCase()&&p!==oldName)){ alert(`«${newName}» вже є.`); return false; }
    state.people=state.people.map(p=>p===oldName?newName:p); state.people.sort((a,b)=>a.localeCompare(b,"uk"));
    state.tasks.forEach(t=>{ if(t.assignee===oldName) t.assignee=newName; if(t.createdBy===oldName) t.createdBy=newName; });
    if(state.creds.some(c=>c.name===oldName)){ state.creds=state.creds.map(c=>c.name===oldName?{...c,name:newName}:c); persistCreds(); }
    if(state.identity===oldName){ state.identity=newName; persistIdentity(); }
    persistPeople(); persistTasks(); logAction("перейменував(-ла) людину на",newName); return true;
  }
  function removePerson(name){
    const cred=state.creds.find(c=>c.name===name);
    if(cred&&cred.master){ alert(`«${name}» — головний адміністратор, його не можна видалити.`); return false; }
    const cnt=state.tasks.filter(t=>t.assignee===name).length;
    if(!confirm(cnt>0?`У «${name}» ${cnt} задач. Видалити? Поле відповідального очиститься.`:`Видалити «${name}»?`)) return false;
    state.people=state.people.filter(p=>p!==name);
    if(cred){ state.creds=state.creds.filter(c=>c.name!==name); persistCreds(); }
    if(cnt>0) state.tasks.forEach(t=>{ if(t.assignee===name) t.assignee=""; });
    if(state.identity===name){ state.identity=null; persistIdentity(); }
    persistPeople(); persistTasks(); logAction("видалив(-ла) людину",name); return true;
  }

          <div class="view-item"><div class="vl">Ким створено</div><div class="vv ${t.createdBy?'':'muted'}">${t.createdBy||"не вказано"}</div></div>
          <div class="view-item"><div class="vl">Спринт</div><div class="vv ${sp?'':'muted'}">${sp?sp.name+" · "+fmtRange(sp):"без спринта"}</div></div>
          ${t.status!=='done'&&t.due?`<div class="view-item"><div class="vl">Лишилось</div><div class="vv" style="color:${dueColor}">${daysLeftText(t.due)}</div></div>`:""}
        </div>
        ${outOfRange?`<div class="inline-warn">Термін поза межами спринта «${sp.name}» (${fmtRange(sp)}).</div>`:""}
        ${cl.length?`<div class="field-label">Чекліст (${cl.filter(i=>i.done).length}/${cl.length})</div><div class="view-checklist">${cl.map(i=>`<div class="vc-row ${i.done?'done':''}"><input type="checkbox" ${i.done?'checked':''} ${admin?'':'disabled'} data-vc="${i.id}"><span>${i.text}</span></div>`).join("")}</div>`:""}
        ${t.updatedAt?`<div class="audit-line">Останнє редагування: <b>${t.updatedBy||"?"}</b>, ${fmtDateTime(t.updatedAt)}</div>`:""}
        ${!admin && !state.identity ? `<div class="inline-warn" style="margin-top:12px;">Щоб редагувати, увійдіть як адміністратор.</div>` : ""}
        ${!admin && state.identity ? `<div class="audit-line">Редагувати задачі можуть лише адміністратори з паролем.</div>` : ""}
        <div class="modal-actions">
          ${admin?`<button class="btn danger" data-delete>Видалити</button>`:`<div></div>`}
          <div style="display:flex; gap:8px;">
            <button class="btn ghost" data-cancel>Закрити</button>
            ${admin?`<button class="btn accent" data-edit>Редагувати</button>`:""}
            ${!admin && !state.identity?`<button class="btn accent" data-login>Увійти, щоб редагувати</button>`:""}
          </div>
        </div>
      </div>`;
    o.addEventListener("click",e=>{ if(e.target===o) closeModal(); });
    o.querySelector("[data-cancel]").addEventListener("click",closeModal);
    const eb=o.querySelector("[data-edit]"); if(eb) eb.addEventListener("click",()=>openEditModal(t.id));
    const lb=o.querySelector("[data-login]"); if(lb) lb.addEventListener("click",()=>{ state.modal={mode:'identity'}; render(); });
    const db=o.querySelector("[data-delete]"); if(db) db.addEventListener("click",()=>{ if(confirm(`Видалити задачу «${t.title}»?`)){ state.tasks=state.tasks.filter(x=>x.id!==t.id); persistTasks(); logAction("видалив(-ла) задачу",t.title); closeModal(); render(); } });
    if(admin) o.querySelectorAll("[data-vc]").forEach(cb=>cb.addEventListener("change",()=>{
      const real=state.tasks.find(x=>x.id===t.id); if(!real) return;
      const it=real.checklist.find(i=>i.id===cb.dataset.vc); if(it) it.done=cb.checked;
      stampTask(real); persistTasks(); logAction("оновив(-ла) чекліст у",real.title);
      state.modal.task={...real,checklist:real.checklist.map(i=>({...i}))}; renderViewModal();
    }));
  }

  function renderModal(){
    if(!isAdmin()){ closeModal(); return; }
    const o=ensureOverlay(); const t=state.modal.task; const sp=t.sprint?sprintById(t.sprint):null; const more=state.showMore;
    const clItems=(t.checklist||[]).map(i=>`<div class="cl-item" data-cl="${i.id}"><input type="checkbox" ${i.done?'checked':''} data-cl-done><input type="text" value="${(i.text||'').replace(/"/g,'&quot;')}" data-cl-text placeholder="Пункт"><button class="cl-del" data-cl-del>&times;</button></div>`).join("");
    o.innerHTML=`
      <div class="modal">
        <h3>${state.modal.mode==='create'?'Нова задача':'Редагувати задачу'}</h3>
        <div class="field-label">Назва</div>
        <input type="text" id="f-title" value="${(t.title||'').replace(/"/g,'&quot;')}" placeholder="Наприклад: Оновити навчальний план">
        <div class="modal-row">
          <div><div class="field-label">Статус</div><select id="f-status">${COLUMNS.map(c=>`<option value="${c.key}" ${c.key===t.status?'selected':''}>${c.name}</option>`).join("")}</select></div>
          <div><div class="field-label">Пріоритет</div><select id="f-priority">${Object.entries(PRIORITIES).map(([k,v])=>`<option value="${k}" ${k===t.priority?'selected':''}>${v}</option>`).join("")}</select></div>
        </div>
        <div class="modal-row">
          <div>
            <div class="field-label">Відповідальний</div>
            <select id="f-assignee"><option value="">— не призначено —</option>${state.people.map(p=>`<option value="${p}" ${p===t.assignee?'selected':''}>${p}</option>`).join("")}<option value="__add__">+ Додати нову людину…</option></select>
            <input type="text" id="f-assignee-new" placeholder="Ім'я нової людини" style="display:none; margin-top:6px;">
          </div>
          <div><div class="field-label">Кінцевий термін</div><input type="date" id="f-due" value="${t.due||''}" ${sp?`min="${sp.start}" max="${sp.end}"`:''}></div>
        </div>
        <div id="due-warn"></div>
        <div id="more-fields" style="display:${more?'block':'none'};">
          <div class="field-label">Спринт</div>
          <select id="f-sprint"><option value="">— без спринта —</option>${sprintOptionsHTML(t.sprint, false)}</select>
          <div class="field-label">Посилання</div>
          <input type="text" id="f-link" value="${(t.link||'').replace(/"/g,'&quot;')}" placeholder="https://...">
          <div class="field-label">Ким створено</div>
          <select id="f-createdBy"><option value="">— не вказано —</option>${state.people.map(p=>`<option value="${p}" ${p===t.createdBy?'selected':''}>${p}</option>`).join("")}<option value="__add__">+ Додати нову людину…</option></select>
          <input type="text" id="f-createdBy-new" placeholder="Ім'я нової людини" style="display:none; margin-top:6px;">
          <div class="field-label">Чекліст</div>
          <div id="cl-list">${clItems}</div>
          <button class="cl-add" id="cl-add">+ Додати пункт</button>
        </div>
        <button class="more-toggle" data-more>${more?'▲ Менше полів':'▼ Більше полів (спринт, посилання, чекліст)'}</button>
        <div class="modal-actions">
          <div>${state.modal.mode==='edit'?`<button class="btn danger" data-delete>Видалити</button>`:''}</div>
          <div style="display:flex; gap:8px;"><button class="btn ghost" data-cancel>${state.modal.mode==='edit'?'Назад':'Скасувати'}</button><button class="btn primary" data-save>Зберегти</button></div>
        </div>
      </div>`;
    o.addEventListener("click",e=>{ if(e.target===o) closeModal(); });

    o.querySelector("[data-more]").addEventListener("click",()=>{ collectDraft(); state.showMore=!state.showMore; renderModal(); });
    const del=o.querySelector("[data-delete]"); if(del) del.addEventListener("click",()=>{ state.tasks=state.tasks.filter(x=>x.id!==t.id); persistTasks(); logAction("видалив(-ла) задачу",t.title); closeModal(); render(); });
    o.querySelector("[data-cancel]").addEventListener("click",()=>{ if(state.modal.mode==='edit') openViewModal(t.id); else closeModal(); });

    function draftEl(id){ return document.getElementById(id); }
    function collectDraft(){
      // preserve typed values into state.modal.task when toggling "more"
      t.title=draftEl("f-title").value; t.status=draftEl("f-status").value; t.priority=draftEl("f-priority").value;
      const aSel=draftEl("f-assignee"); t.assignee=aSel.value==="__add__"?t.assignee:aSel.value;
      t.due=draftEl("f-due").value||null;
      if(draftEl("f-sprint")) t.sprint=draftEl("f-sprint").value||null;
      if(draftEl("f-link")) t.link=draftEl("f-link").value;
      if(draftEl("f-createdBy")){ const cSel=draftEl("f-createdBy"); t.createdBy=cSel.value==="__add__"?t.createdBy:cSel.value; }
      const clList=draftEl("cl-list");
      if(clList) t.checklist=Array.from(clList.querySelectorAll(".cl-item")).map(r=>({id:r.dataset.cl,text:r.querySelector("[data-cl-text]").value,done:r.querySelector("[data-cl-done]").checked})).filter(i=>i.text.trim());
    }

    function wire(selId,inpId){ const s=draftEl(selId),i=draftEl(inpId); if(!s) return; s.addEventListener("change",()=>{ if(s.value==="__add__"){ i.style.display="block"; i.focus(); } else i.style.display="none"; }); }
    wire("f-assignee","f-assignee-new"); wire("f-createdBy","f-createdBy-new");

    const sprintSel=draftEl("f-sprint"), dueInp=draftEl("f-due"), dueWarn=draftEl("due-warn");
    function refreshBounds(){ const s=sprintSel?sprintById(sprintSel.value):null; if(s){ dueInp.min=s.start; dueInp.max=s.end; } else { dueInp.removeAttribute("min"); dueInp.removeAttribute("max"); } checkDue(); }
    function checkDue(){ const s=sprintSel?sprintById(sprintSel.value):(t.sprint?sprintById(t.sprint):null); if(s&&dueInp.value&&(dueInp.value<s.start||dueInp.value>s.end)) dueWarn.innerHTML=`<div class="inline-warn">Термін поза межами спринта «${s.name}» (${fmtRange(s)}).</div>`; else dueWarn.innerHTML=""; }
    if(sprintSel) sprintSel.addEventListener("change",()=>{ const s=sprintById(sprintSel.value); if(s&&!dueInp.value) dueInp.value=s.end; refreshBounds(); });
    dueInp.addEventListener("change",checkDue); refreshBounds();

    const clList=draftEl("cl-list");
    if(clList){
      draftEl("cl-add").addEventListener("click",()=>{ const row=document.createElement("div"); row.className="cl-item"; row.dataset.cl="c"+Math.random().toString(36).slice(2,8); row.innerHTML=`<input type="checkbox" data-cl-done><input type="text" data-cl-text placeholder="Пункт"><button class="cl-del" data-cl-del>&times;</button>`; row.querySelector("[data-cl-del]").addEventListener("click",()=>row.remove()); clList.appendChild(row); row.querySelector("[data-cl-text]").focus(); });
      clList.querySelectorAll("[data-cl-del]").forEach(b=>b.addEventListener("click",()=>b.closest(".cl-item").remove()));
    }

    function resolvePerson(selId,inpId){ const s=draftEl(selId),i=draftEl(inpId); if(!s) return t[selId==="f-assignee"?"assignee":"createdBy"]||""; if(s.value==="__add__"){ const v=(i.value||"").trim(); if(v&&!state.people.some(p=>p.toLowerCase()===v.toLowerCase())){ state.people.push(v); state.people.sort((a,b)=>a.localeCompare(b,"uk")); persistPeople(); } return v; } return s.value; }

    o.querySelector("[data-save]").addEventListener("click",()=>{
      const title=draftEl("f-title").value.trim(); if(!title){ draftEl("f-title").focus(); return; }
      const status=draftEl("f-status").value; const due=dueInp.value||null;
      const sprint=sprintSel?(sprintSel.value||null):(t.sprint||null);
      let checklist=t.checklist||[];
      if(clList) checklist=Array.from(clList.querySelectorAll(".cl-item")).map(r=>({id:r.dataset.cl,text:r.querySelector("[data-cl-text]").value.trim(),done:r.querySelector("[data-cl-done]").checked})).filter(i=>i.text);
      const wasDone=t.status==="done";
      let completedAt=t.completedAt||null;
      if(status==="done"&&!completedAt) completedAt=isoOf(new Date());
      if(status!=="done") completedAt=null;
      const updated={...t,title,status,due,sprint,checklist,completedAt,
        priority:draftEl("f-priority").value,
        assignee:resolvePerson("f-assignee","f-assignee-new"),
        link:draftEl("f-link")?draftEl("f-link").value.trim():(t.link||""),
        createdBy:draftEl("f-createdBy")?resolvePerson("f-createdBy","f-createdBy-new"):(t.createdBy||""),
      };
      stampTask(updated);
      const wasEdit=state.modal.mode==='edit';
      if(wasEdit){ state.tasks=state.tasks.map(x=>x.id===updated.id?updated:x); logAction("змінив(-ла) задачу",title); }
      else { state.tasks.push(updated); logAction("створив(-ла) задачу",title); }
      persistTasks();
      if(status==="done"&&!wasDone) toast("✓ Задачу завершено");
      if(wasEdit) openViewModal(updated.id); else { closeModal(); render(); }
    });
  }

  function openCreateModal(status){
    if(!isAdmin()){ toast("Лише адміністратор може створювати задачі"); return; }
    const defSprint=state.selectedSprint!=="all"?state.selectedSprint:null;
    state.showMore=false;
    state.modal={mode:'create',task:{id:uid(),title:"",link:"",status:status||"backlog",createdBy:state.identity||"",assignee:"",priority:"medium",due:null,sprint:defSprint,checklist:[],completedAt:null,updatedAt:null,updatedBy:null}};
    render();
  }
  function openViewModal(id){ const t=state.tasks.find(x=>x.id===id); if(!t) return; state.modal={mode:'view',task:{...t,checklist:(t.checklist||[]).map(i=>({...i}))}}; render(); }
  function openEditModal(id){ if(!isAdmin()) return; const t=state.tasks.find(x=>x.id===id); if(!t) return; state.showMore=false; state.modal={mode:'edit',task:{...t,checklist:(t.checklist||[]).map(i=>({...i}))}}; render(); }

  function bindEvents(){
    const root=document.getElementById("admin-board-root");
    state.dragMoved=false; // reset so a click after a previous drag still opens the card
    root.querySelectorAll("[data-view]").forEach(el=>el.addEventListener("click",()=>{ state.view=el.dataset.view; render(); }));
    const ss=root.querySelector("[data-sprint]"); if(ss) ss.addEventListener("change",()=>{ state.selectedSprint=ss.value; render(); });
    const lg=root.querySelector("[data-log]"); if(lg) lg.addEventListener("click",()=>{ state.modal={mode:'log'}; render(); });
    const st=root.querySelector("[data-settings]"); if(st) st.addEventListener("click",()=>{ state.revealPass=null; state.modal={mode:'settings'}; render(); });
    const wa=root.querySelector("[data-whoami]"); if(wa) wa.addEventListener("click",()=>{ state.modal={mode:'identity'}; render(); });
    root.querySelectorAll("[data-add-to]").forEach(el=>el.addEventListener("click",()=>openCreateModal(el.dataset.addTo)));
    root.querySelectorAll("[data-filter]").forEach(el=>{ el.addEventListener("input",()=>{ state.filters[el.dataset.filter]=el.value; render(); }); el.addEventListener("change",()=>{ state.filters[el.dataset.filter]=el.value; render(); }); });
    const rb=root.querySelector("[data-reset]"); if(rb) rb.addEventListener("click",()=>{ state.filters={search:"",status:"all",createdBy:"all",assignee:"all",priority:"all",due:"all"}; render(); });

    root.querySelectorAll(".card").forEach(el=>{
      el.addEventListener("click",()=>{ if(!state.dragMoved) openViewModal(el.dataset.id); });
      if(isAdmin()){
        el.addEventListener("dragstart",()=>{ state.dragId=el.dataset.id; state.dragMoved=false; el.classList.add("dragging"); });
        el.addEventListener("dragend",()=>el.classList.remove("dragging"));
      }
    });
    root.querySelectorAll(".cal-task").forEach(el=>el.addEventListener("click",()=>openViewModal(el.dataset.id)));

    if(isAdmin()) root.querySelectorAll(".kcol").forEach(col=>{
      col.addEventListener("dragover",e=>{ e.preventDefault(); col.classList.add("drag-over"); });
      col.addEventListener("dragleave",()=>col.classList.remove("drag-over"));
      col.addEventListener("drop",e=>{ e.preventDefault(); col.classList.remove("drag-over");
        if(state.dragId){ state.dragMoved=true; const task=state.tasks.find(x=>x.id===state.dragId);
          if(task&&task.status!==col.dataset.col){ const wasDone=task.status==="done"; task.status=col.dataset.col;
            if(task.status==="done"&&!task.completedAt) task.completedAt=isoOf(new Date());
            if(task.status!=="done") task.completedAt=null;
            stampTask(task); persistTasks(); logAction("перемістив(-ла) задачу",task.title);
            if(task.status==="done"&&!wasDone) toast("✓ Задачу завершено");
          }
          state.dragId=null; render();
        }
      });
    });

    const pv=root.querySelector("[data-cal-prev]"); if(pv) pv.addEventListener("click",()=>{ state.calMonth--; if(state.calMonth<0){state.calMonth=11;state.calYear--;} render(); });
    const nx=root.querySelector("[data-cal-next]"); if(nx) nx.addEventListener("click",()=>{ state.calMonth++; if(state.calMonth>11){state.calMonth=0;state.calYear++;} render(); });
