<style>
  #start-root {
    --graphite:#505353; --orange:#ef7726; --orange-soft:#FBDFC7; --green:#8bb047; --green-soft:#E4EDD3;
    --lilac:#b7a9dc; --lilac-soft:#ECE7F5; --cream:#f9f3ed; --paper:#FFFFFF; --grey:#7C7F7F; --line:#EAE2D8; --red:#C1503D;
    font-family:'Rubik','Segoe UI',sans-serif; color:#3A3C3C; background:var(--cream);
    min-height:100vh; padding:0 0 60px 0; position:relative; overflow-x:hidden;
  }
  #start-root *{box-sizing:border-box;}
  #start-root .blob{position:absolute;pointer-events:none;z-index:0;}
  #start-root .blob.b1{top:-30px;right:-40px;width:280px;opacity:0.45;}
  #start-root .blob.b2{bottom:-60px;left:-50px;width:240px;opacity:0.4;}
  #start-root .wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 24px;}

  #start-root .topbar{background:var(--paper);border-bottom:1px solid var(--line);padding:18px 0;margin-bottom:28px;position:relative;z-index:1;}
  #start-root .topbar-in{max-width:1100px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  #start-root .logo{height:52px;width:auto;display:block;}
  #start-root .title-block{flex:1;min-width:200px;}
  #start-root .eyebrow{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--orange);font-weight:700;}
  #start-root h1{margin:2px 0 0 0;font-size:23px;font-weight:300;color:var(--graphite);letter-spacing:0.01em;}

  #start-root .btn{font-family:'Rubik',sans-serif;font-size:13px;font-weight:500;border-radius:8px;padding:9px 16px;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--graphite);transition:all .15s;}
  #start-root .btn:hover{border-color:var(--orange);}
  #start-root .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600;}
  #start-root .btn.primary:hover{filter:brightness(1.05);}
  #start-root .btn.small{font-size:12px;padding:6px 11px;}
  #start-root .btn.danger{color:var(--red);border-color:#E8C3BB;}

  #start-root .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px;}
  #start-root input[type=text]{font-family:'Rubik',sans-serif;font-size:13px;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--graphite);outline:none;}
  #start-root input[type=text]:focus{border-color:var(--orange);}
  #start-root .search{flex:1;min-width:220px;}

  #start-root .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  #start-root .tile{background:var(--paper);border-radius:14px;padding:18px 20px;border-top:4px solid var(--orange);box-shadow:0 1px 3px rgba(80,83,83,0.07);display:flex;flex-direction:column;}
  #start-root .tile.c1{border-top-color:var(--orange);}
  #start-root .tile.c2{border-top-color:var(--green);}
  #start-root .tile.c3{border-top-color:var(--lilac);}
  #start-root .tile-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px;}
  #start-root .tile-name{flex:1;font-size:15.5px;font-weight:600;color:var(--graphite);line-height:1.3;}
  #start-root .tile-count{font-size:11px;color:var(--grey);white-space:nowrap;padding-top:3px;}

  #start-root .link-row{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:8px;background:var(--cream);margin-bottom:7px;text-decoration:none;transition:all .15s;}
  #start-root .link-row:hover{background:var(--orange-soft);}
  #start-root .link-ic{font-size:14px;}
  #start-root .link-title{flex:1;font-size:13px;color:var(--graphite);font-weight:500;}
  #start-root .empty-hint{font-size:12px;color:var(--grey);font-style:italic;padding:8px 0;}

  #start-root .tile-actions{margin-top:auto;padding-top:10px;display:flex;gap:6px;flex-wrap:wrap;}

  #start-root .modal-bg{position:fixed;inset:0;background:rgba(80,83,83,0.45);display:flex;align-items:center;justify-content:center;z-index:900;padding:20px;}
  #start-root .modal{background:var(--paper);border-radius:14px;padding:24px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;}
  #start-root .modal h3{margin:0 0 14px 0;font-size:17px;font-weight:600;color:var(--graphite);}
  #start-root .field-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--grey);margin:12px 0 5px 0;}
  #start-root .modal input[type=text]{width:100%;}
  #start-root textarea{width:100%;font-family:ui-monospace,monospace;font-size:11.5px;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--cream);color:var(--graphite);outline:none;resize:vertical;}
  #start-root .modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;}
  #start-root .note{background:var(--lilac-soft);border-left:3px solid var(--lilac);padding:11px 14px;border-radius:6px;font-size:12px;color:#4A3F63;line-height:1.55;margin:14px 0;}
  #start-root .edit-badge{background:var(--green-soft);color:#3C5220;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:14px;}
  @media (max-width:640px){ #start-root h1{font-size:19px;} }
</style>

  const SHEET_URL_BUILTIN="https://script.google.com/macros/s/AKfycbwYiaxa90x0mpv90kePeUn5JIaD5x5fcgD4G8VMe1lA4zRpZOYcvnEnF7oJJOAforW1/exec";

  let SHEET_URL="";
  try{
    const p=new URLSearchParams(location.search).get("sheet");
    SHEET_URL=(p&&p.trim())||SHEET_URL_BUILTIN||localStorage.getItem("start-page:sheet-url")||"";
  }catch(e){ SHEET_URL=SHEET_URL_BUILTIN||""; }
  function remoteOn(){ return !!SHEET_URL; }

  let remote={}, remoteOk=false, remoteErr="";
  async function remoteLoad(){
    if(!remoteOn()) return false;
    try{
      const r=await fetch(SHEET_URL,{method:"GET"});
      const j=await r.json();
      if(j&&j.ok){ remote=j.data||{}; remoteOk=true; remoteErr=""; return true; }
      remoteErr=(j&&j.error)||"таблиця не відповіла";
    }catch(e){ remoteErr="немає зв'язку"; }
    remoteOk=false; return false;
  }
  async function remoteSet(key,val){
    if(!remoteOn()) return;
    const payload=typeof val==="string"?val:JSON.stringify(val);
    remote[key]=payload;
    try{
      await fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({items:{[key]:payload}})});
      remoteOk=true;
    }catch(e){ remoteOk=false; remoteErr="не вдалося зберегти"; }
  }

  // одностороннє перетворення пароля: сам пароль ніде не зберігається
  function hashPass(pass,salt){
    const str=(salt||"")+"::"+pass;
    let h1=0x811c9dc5,h2=0xc2b2ae35>>>0;
    for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i);
      h1=Math.imul(h1^ch,0x01000193)>>>0;
      h2=Math.imul((h2^((ch<<3)|(ch>>>2)))>>>0,0x85ebca6b)>>>0; }
    return (h1>>>0).toString(16).padStart(8,"0")+(h2>>>0).toString(16).padStart(8,"0");
  }

  const DEFAULTS=[
    "Українська мова","Українська література","Зарубіжна література","Англійська мова",
    "Математика","Природничі науки","Захист України","Інформатика"
  ];

  let uid=Date.now();
  function nid(){ return "id"+(++uid); }

  const state={ subjects:[], edit:false, isAdmin:false, q:"", modal:null, loaded:false };

  async function load(){
    if(remoteOn()) await remoteLoad();
    if(remoteOk && remote[SUB_KEY]){
      try{ const d=JSON.parse(remote[SUB_KEY]); if(Array.isArray(d)) state.subjects=d; }catch(e){}
    }
    if(!state.subjects.length){
      try{
        const r=await store.get(KEY,false);
        if(r&&r.value){ const d=JSON.parse(r.value); if(Array.isArray(d.subjects)) state.subjects=d.subjects; }
      }catch(e){}
    }
    if(!state.subjects.length){
      state.subjects=DEFAULTS.map(n=>({id:nid(),name:n,links:[]}));
    }
    state.loaded=true; render();
  }
  function persist(){
    try{ store.set(KEY,JSON.stringify({subjects:state.subjects}),false); }catch(e){}
    if(remoteOn()&&state.isAdmin) remoteSet(SUB_KEY,state.subjects);
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function safeUrl(u){
    u=String(u||"").trim();
    if(!u) return "";
    if(/^(https?:|\.\/|\.\.\/|\/)/i.test(u)) return u;
    if(/^javascript:/i.test(u)) return "";
    return "./"+u;
  }

  // Кнопка редагування показується лише за секретним посиланням ?edit=1
  function canEdit(){
    try{ return new URLSearchParams(location.search).get("edit")==="1"; }catch(e){ return false; }
  }
  function passIsSet(){ return !!(remote[PASS_KEY]); }

  function tileHTML(s,idx){
    const cls=["c1","c2","c3"][idx%3];
    const links=s.links||[];
    const rows=links.length
      ? links.map(l=>state.edit
          ? `<div class="link-row"><span class="link-ic">📋</span><span class="link-title">${esc(l.title)}</span>
               <button class="btn small" data-editlink="${s.id}:${l.id}">✎</button>
               <button class="btn small danger" data-dellink="${s.id}:${l.id}">✕</button></div>`
          : `<a class="link-row" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">
               <span class="link-ic">📋</span><span class="link-title">${esc(l.title)}</span><span style="color:var(--grey);font-size:12px;">↗</span></a>`
        ).join("")
      : `<div class="empty-hint">${state.edit?"Додайте посилання на канбан цього предмета.":"Посилань поки немає."}</div>`;
    return `<div class="tile ${cls}">
      <div class="tile-head">
        <div class="tile-name">${esc(s.name)}</div>
        <div class="tile-count">${links.length} ${links.length===1?"дошка":"дошок"}</div>
      </div>
      ${rows}
      ${state.edit?`<div class="tile-actions">
        <button class="btn small primary" data-addlink="${s.id}">+ Посилання</button>
        <button class="btn small" data-renamesub="${s.id}">Перейменувати</button>
        <button class="btn small danger" data-delsub="${s.id}">Видалити</button>
      </div>`:""}
    </div>`;
  }

  function render(){
    const root=document.getElementById("start-root");
    if(!root) return;
    if(!state.loaded){ root.innerHTML=`<div style="padding:40px;font-family:'Rubik',sans-serif;color:#7C7F7F">Завантаження…</div>`; return; }
    const q=state.q.trim().toLowerCase();
    const list=state.subjects.filter(s=>{
      if(!q) return true;
      if(s.name.toLowerCase().includes(q)) return true;
      return (s.links||[]).some(l=>String(l.title).toLowerCase().includes(q));
    });
    root.innerHTML=`
      <svg class="blob b1" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M70 12C130-8 236 8 252 62c16 52-26 108-84 116C104 188 40 164 18 114-4 60 14 30 70 12Z" fill="#8bb047" opacity="0.35"/></svg>
      <svg class="blob b2" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M44 42C4 92 8 166 62 194c48 26 116 10 146-36 26-40 20-100-26-128C134 2 84-4 44 42Z" fill="#b7a9dc" opacity="0.35"/><path d="M164 130c36 6 64 42 56 82-42 8-96-10-110-50-8-26 16-38 54-32Z" fill="#ef7726" opacity="0.25"/></svg>

      <div class="topbar">
        <div class="topbar-in">
          <img src="data:image/png;base64,${LOGO}" class="logo" alt="Логотип коледжу">
          <div class="title-block">
            <div class="eyebrow">Навчальний простір</div>
            <h1>Дошки задач за предметами</h1>
          </div>
          ${state.edit?`<span class="edit-badge">Режим редагування</span>`:""}
          ${(canEdit()||state.isAdmin)?`<button class="btn ${state.edit?"primary":""}" data-toggleedit>${state.edit?"Готово":"Редагувати"}</button>`:""}
          ${state.isAdmin?`<button class="btn" data-config>Налаштування</button>`:""}
        </div>
      </div>

      <div class="wrap">
        <div class="toolbar">
          <input type="text" class="search" id="q" placeholder="Пошук предмета або дошки…" value="${esc(state.q)}">
          ${state.edit?`<button class="btn primary" data-addsub>+ Предмет</button>`:""}
        </div>
        ${list.length?`<div class="grid">${list.map((s,i)=>tileHTML(s,state.subjects.indexOf(s))).join("")}</div>`
          :`<div class="empty-hint" style="padding:30px 0;">Нічого не знайдено за запитом «${esc(state.q)}».</div>`}
      </div>`;
    bind();
    if(state.modal) renderModal();
  }

  function overlay(){
    let o=document.getElementById("start-modal");
    if(!o){ o=document.createElement("div"); o.id="start-modal"; o.className="modal-bg"; document.getElementById("start-root").appendChild(o); }
    return o;
  }
  function closeModal(){ state.modal=null; const o=document.getElementById("start-modal"); if(o) o.remove(); }

  function renderModal(){
    const m=state.modal; if(!m) return;
    const o=overlay();
    if(m.mode==="login"){
      const first=!passIsSet();
      o.innerHTML=`<div class="modal">
        <h3>${first?"Створіть пароль редактора":"Вхід для редактора"}</h3>
        <p style="font-size:12.5px;color:var(--grey);margin:0 0 12px 0;">${first
          ?"Це перше налаштування. Придумайте пароль — далі лише той, хто його знає, зможе змінювати плитки й посилання."
          :"Введіть пароль, щоб редагувати список предметів і посилань."}</p>
        <div class="field-label">Пароль</div>
        <input type="password" id="pw" placeholder="Ваш пароль">
        <div id="pw-warn"></div>
        <div class="modal-actions"><button class="btn" data-cancel>Скасувати</button><button class="btn primary" data-dologin>${first?"Створити":"Увійти"}</button></div>
      </div>`;
      o.querySelector("[data-cancel]").addEventListener("click",closeModal);
      const go=async()=>{
        const v=(document.getElementById("pw").value||"").trim();
        const w=document.getElementById("pw-warn");
        if(!v){ w.innerHTML='<div class="note" style="background:#FBDFC7;border-color:#ef7726;color:#7a3a10">Введіть пароль.</div>'; return; }
        if(first){
          const salt=Math.random().toString(36).slice(2,10);
          await remoteSet(PASS_KEY,JSON.stringify({salt,hash:hashPass(v,salt)}));
          state.isAdmin=true; state.edit=true; closeModal(); render(); return;
        }
        let cred=null;
        try{ cred=JSON.parse(remote[PASS_KEY]); }catch(e){}
        if(cred && hashPass(v,cred.salt)===cred.hash){
          state.isAdmin=true; state.edit=true; closeModal(); render();
        } else {
          w.innerHTML='<div class="note" style="background:#FBDFC7;border-color:#ef7726;color:#7a3a10">Невірний пароль.</div>';
        }
      };
      o.querySelector("[data-dologin]").addEventListener("click",go);
      const inp=document.getElementById("pw");
      if(inp) inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
      return;
    }
    if(m.mode==="link"){
      const sub=state.subjects.find(s=>s.id===m.subId); if(!sub){ closeModal(); return; }
      const link=m.linkId?(sub.links||[]).find(l=>l.id===m.linkId):null;
      o.innerHTML=`<div class="modal">
        <h3>${link?"Редагувати посилання":"Нове посилання"} · ${esc(sub.name)}</h3>
        <div class="field-label">Назва (що це за дошка)</div>
        <input type="text" id="l-title" placeholder="Напр.: Канбан групи М-21" value="${esc(link?link.title:"")}">
        <div class="field-label">Посилання або назва файлу</div>
        <input type="text" id="l-url" placeholder="https://… або kanban_math.html" value="${esc(link?link.url:"")}">
        <div class="note">Якщо всі файли лежать поруч із цією сторінкою, достатньо написати назву файлу, наприклад <b>kanban_math.html</b>. Якщо дошка в іншому сервісі — вставте повне посилання.</div>
        <div class="modal-actions"><button class="btn" data-cancel>Скасувати</button><button class="btn primary" data-savelink>Зберегти</button></div>
      </div>`;
      o.querySelector("[data-cancel]").addEventListener("click",closeModal);
      o.querySelector("[data-savelink]").addEventListener("click",()=>{
        const t=document.getElementById("l-title").value.trim();
        const u=document.getElementById("l-url").value.trim();
        if(!t||!u) return;
        if(!sub.links) sub.links=[];
        if(link){ link.title=t; link.url=u; } else { sub.links.push({id:nid(),title:t,url:u}); }
        persist(); closeModal(); render();
      });
      return;
    }
    if(m.mode==="config"){
      o.innerHTML=`<div class="modal">
        <h3>Налаштування сторінки</h3>
        <div class="note">Тут зберігається список предметів і посилань. Скопіюйте цей текст, щоб перенести налаштування на інший комп'ютер або передати колезі. Щоб застосувати чужі налаштування — вставте текст і натисніть «Застосувати».</div>
        <div class="field-label">Код налаштувань</div>
        <textarea id="cfg" rows="10">${esc(JSON.stringify({subjects:state.subjects},null,1))}</textarea>
        <div class="modal-actions">
          <button class="btn" data-cancel>Закрити</button>
          <div style="display:flex;gap:8px;">
            <button class="btn" data-copycfg>Скопіювати</button>
            <button class="btn primary" data-applycfg>Застосувати</button>
          </div>
        </div>
      </div>`;
      o.querySelector("[data-cancel]").addEventListener("click",closeModal);
      o.querySelector("[data-copycfg]").addEventListener("click",()=>{
        const t=document.getElementById("cfg");
        if(navigator.clipboard){ navigator.clipboard.writeText(t.value).then(()=>{ o.querySelector("[data-copycfg]").textContent="Скопійовано"; },()=>{}); }
      });
      o.querySelector("[data-applycfg]").addEventListener("click",()=>{
        try{
          const d=JSON.parse(document.getElementById("cfg").value);
          if(Array.isArray(d.subjects)){ state.subjects=d.subjects; persist(); closeModal(); render(); }
        }catch(e){ alert("Не вдалося прочитати код налаштувань. Перевірте, чи скопійовано його повністю."); }
      });
      return;
    }
  }

  function bind(){
    const root=document.getElementById("start-root");
    const q=document.getElementById("q");
    if(q) q.addEventListener("input",()=>{ state.q=q.value; const p=q.selectionStart; render(); const n=document.getElementById("q"); if(n){ n.focus(); n.setSelectionRange(p,p); } });

    const te=root.querySelector("[data-toggleedit]");
    if(te) te.addEventListener("click",()=>{
      if(state.isAdmin){ state.edit=!state.edit; render(); return; }
      state.modal={mode:"login"}; render();
    });

    const cf=root.querySelector("[data-config]");
    if(cf) cf.addEventListener("click",()=>{ state.modal={mode:"config"}; render(); });

    const as=root.querySelector("[data-addsub]");
    if(as) as.addEventListener("click",()=>{
      const n=prompt("Назва предмета:"); if(!n||!n.trim()) return;
      state.subjects.push({id:nid(),name:n.trim(),links:[]}); persist(); render();
    });

    root.querySelectorAll("[data-addlink]").forEach(b=>b.addEventListener("click",()=>{
      state.modal={mode:"link",subId:b.dataset.addlink}; render();
    }));
    root.querySelectorAll("[data-editlink]").forEach(b=>b.addEventListener("click",()=>{
      const [subId,linkId]=b.dataset.editlink.split(":");
      state.modal={mode:"link",subId,linkId}; render();
    }));
    root.querySelectorAll("[data-dellink]").forEach(b=>b.addEventListener("click",()=>{
      const [subId,linkId]=b.dataset.dellink.split(":");
      const s=state.subjects.find(x=>x.id===subId); if(!s) return;
      if(confirm("Видалити це посилання?")){ s.links=(s.links||[]).filter(l=>l.id!==linkId); persist(); render(); }
    }));
    root.querySelectorAll("[data-renamesub]").forEach(b=>b.addEventListener("click",()=>{
      const s=state.subjects.find(x=>x.id===b.dataset.renamesub); if(!s) return;
      const n=prompt("Нова назва предмета:",s.name); if(!n||!n.trim()) return;
      s.name=n.trim(); persist(); render();
    }));
    root.querySelectorAll("[data-delsub]").forEach(b=>b.addEventListener("click",()=>{
      const s=state.subjects.find(x=>x.id===b.dataset.delsub); if(!s) return;
      if(confirm(`Видалити предмет «${s.name}» разом із посиланнями?`)){
        state.subjects=state.subjects.filter(x=>x.id!==s.id); persist(); render();
      }
    }));
  }

  load();
})();
</script>
